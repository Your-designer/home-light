<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#080909">
    <meta name="color-scheme" content="dark">

    <title>404 — HOME LIGHT</title>

    <meta name="description"
          content="Страница не найдена. Вернитесь на сайт HOME LIGHT.">

    <meta name="robots" content="noindex, follow">

    <link rel="canonical" href="https://homelight.pro/">

    <link rel="icon" type="image/png" sizes="32x32" href="./img/favicon-32x32.png">
    <link rel="shortcut icon" href="./img/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./img/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* ============================================================
           HOME LIGHT — 404
           ============================================================ */

        :root {
            --bg: #080909;
            --white: #ffffff;
            --muted: rgba(255,255,255,.42);
            --soft: rgba(255,255,255,.18);
            --line: rgba(255,255,255,.09);
            --gold: #f5c875;
            --cream: #f5f1e9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        html {
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 48%,
                    rgba(245,200,117,.055),
                    transparent 27%
                ),
                var(--bg);
            color: var(--white);
            font-family: Manrope, sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }


        /* ============================================================
           AMBIENT GRID
           ============================================================ */

        .error-page {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            isolation: isolate;
        }

        .error-page::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -4;

            background-image:
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                );

            background-size: 80px 80px;

            mask-image: linear-gradient(
                to bottom,
                transparent,
                black 18%,
                black 82%,
                transparent
            );

            pointer-events: none;
        }

        .error-page::after {
            content: "";
            position: absolute;
            z-index: -3;

            width: 620px;
            height: 620px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(245,200,117,.075) 0%,
                    rgba(245,200,117,.025) 35%,
                    transparent 68%
                );

            filter: blur(20px);

            pointer-events: none;
        }


        /* ============================================================
           HEADER
           ============================================================ */

        .error-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;

            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: space-between;

            width: min(1400px, calc(100% - 64px));
            height: 92px;

            margin: 0 auto;
        }

        .error-logo {
            display: inline-flex;
            align-items: center;
            gap: 11px;
        }

        .error-logo-mark {
            position: relative;

            width: 32px;
            height: 32px;

            border: 1px solid rgba(255,255,255,.2);
            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 50% 38%,
                    rgba(245,200,117,.28),
                    rgba(245,200,117,.04) 45%,
                    transparent 70%
                );

            box-shadow:
                0 0 22px rgba(245,200,117,.09);
        }

        .error-logo-mark::before,
        .error-logo-mark::after {
            content: "";

            position: absolute;

            width: 12px;
            height: 2px;

            left: 9px;

            border-radius: 2px;

            background: rgba(255,255,255,.88);

            transform: rotate(-45deg);
        }

        .error-logo-mark::before {
            top: 11px;
        }

        .error-logo-mark::after {
            top: 17px;
        }

        .error-logo-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .error-logo-text strong {
            font-size: 13px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: .18em;
        }

        .error-logo-text span {
            font-size: 7px;
            line-height: 1;
            font-weight: 500;
            letter-spacing: .34em;
            color: rgba(255,255,255,.4);
        }

        .error-header-code {
            font-size: 8px;
            font-weight: 600;
            letter-spacing: .2em;
            color: rgba(255,255,255,.22);
        }


        /* ============================================================
           MAIN
           ============================================================ */

        .error-main {
            position: relative;
            z-index: 5;

            width: min(1400px, calc(100% - 64px));
            min-height: 100vh;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 100px 0 80px;
        }

        .error-content {
            width: 100%;
            text-align: center;
        }


        /* ============================================================
           KICKER
           ============================================================ */

        .error-kicker {
            display: inline-flex;
            align-items: center;
            gap: 13px;

            margin-bottom: 22px;

            font-size: 9px;
            font-weight: 600;
            letter-spacing: .18em;
            text-transform: uppercase;

            color: rgba(255,255,255,.38);
        }

        .error-kicker::before {
            content: "";

            width: 28px;
            height: 1px;

            background: rgba(245,200,117,.7);
        }

        .error-kicker::after {
            content: "";

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: var(--gold);

            box-shadow:
                0 0 7px var(--gold),
                0 0 18px rgba(245,200,117,.45);

            animation: errorPulse 2.4s ease-in-out infinite;
        }


        /* ============================================================
           404
           ============================================================ */

        .error-number {
            position: relative;

            display: inline-block;

            font-size: clamp(170px, 29vw, 430px);
            line-height: .72;

            font-weight: 500;
            letter-spacing: -.105em;

            color: rgba(255,255,255,.94);

            user-select: none;
        }

        /*
         * Очень тонкий золотой свет проходит через цифры.
         */

        .error-number::before {
            content: "";

            position: absolute;

            left: -12%;
            right: -12%;

            top: 53%;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent 0%,
                    rgba(245,200,117,0) 18%,
                    rgba(245,200,117,.95) 48%,
                    #fff 50%,
                    rgba(245,200,117,.8) 52%,
                    rgba(245,200,117,0) 82%,
                    transparent 100%
                );

            box-shadow:
                0 0 8px rgba(255,255,255,.8),
                0 0 24px rgba(245,200,117,.65),
                0 0 55px rgba(245,200,117,.18);

            transform: translateX(-65%);

            animation:
                errorLightRoute 4.8s
                cubic-bezier(.16,1,.3,1)
                infinite;

            pointer-events: none;
        }

        /*
         * Лёгкая тень под цифрами — создаёт ощущение свечения,
         * но не превращает 404 в неоновую вывеску.
         */

        .error-number::after {
            content: "404";

            position: absolute;
            inset: 0;

            z-index: -1;

            color: transparent;

            text-shadow:
                0 0 45px rgba(245,200,117,.08),
                0 0 100px rgba(245,200,117,.04);
        }


        /* ============================================================
           TEXT
           ============================================================ */

        .error-title {
            margin-top: 52px;

            font-size: clamp(27px, 3vw, 43px);
            line-height: 1;
            font-weight: 500;

            letter-spacing: -.045em;
        }

        .error-title span {
            color: rgba(255,255,255,.36);
        }

        .error-description {
            max-width: 430px;

            margin: 22px auto 0;

            font-size: 13px;
            line-height: 1.7;

            color: rgba(255,255,255,.4);
        }


        /* ============================================================
           BUTTON
           ============================================================ */

        .error-button {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            min-width: 205px;
            min-height: 56px;

            margin-top: 32px;
            padding: 0 9px 0 23px;

            background: var(--cream);
            color: #111;

            font-size: 10px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;

            border: 0;
            border-radius: 0;

            cursor: pointer;

            transition:
                transform .35s,
                box-shadow .35s,
                background .35s;
        }

        .error-button-arrow {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 38px;
            height: 38px;

            flex: 0 0 38px;

            border-radius: 50%;

            background: #111;
            color: #fff;

            font-size: 15px;

            transition:
                transform .4s cubic-bezier(.16,1,.3,1);
        }

        .error-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 40px rgba(245,200,117,.13);
        }

        .error-button:hover .error-button-arrow {
            transform: rotate(45deg);
        }


        /* ============================================================
           ROUTE / FOOTER
           ============================================================ */

        .error-route {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 28px;

            display: grid;
            grid-template-columns: auto minmax(50px,1fr) auto;

            align-items: center;
            gap: 20px;

            font-size: 8px;
            font-weight: 600;
            letter-spacing: .18em;

            color: rgba(255,255,255,.22);
        }

        .error-route strong {
            font-size: 8px;
            font-weight: 600;
            letter-spacing: .18em;

            color: rgba(245,200,117,.55);
        }

        .error-route-line {
            position: relative;

            height: 1px;

            overflow: hidden;

            background:
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.04),
                    rgba(255,255,255,.16),
                    rgba(255,255,255,.04)
                );
        }

        .error-route-light {
            position: absolute;

            top: 50%;
            left: -20%;

            width: 20%;
            height: 1px;

            margin-top: -0.5px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--gold)
                );

            box-shadow:
                0 0 10px rgba(245,200,117,.65);

            animation:
                errorRoute 5s
                linear
                infinite;
        }


        /* ============================================================
           FLOATING LIGHT
           ============================================================ */

        .error-orb {
            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: #fff;

            box-shadow:
                0 0 7px #fff,
                0 0 18px var(--gold),
                0 0 38px rgba(245,200,117,.55);

            opacity: .8;

            pointer-events: none;
        }

        .error-orb-1 {
            top: 34%;
            left: 17%;

            animation:
                orbFloat1 7s ease-in-out infinite;
        }

        .error-orb-2 {
            top: 64%;
            right: 19%;

            width: 3px;
            height: 3px;

            opacity: .5;

            animation:
                orbFloat2 9s ease-in-out infinite;
        }


        /* ============================================================
           ANIMATIONS
           ============================================================ */

        @keyframes errorLightRoute {

            0% {
                transform: translateX(-65%);
                opacity: 0;
            }

            10% {
                opacity: .9;
            }

            50% {
                opacity: 1;
            }

            90% {
                opacity: .9;
            }

            100% {
                transform: translateX(65%);
                opacity: 0;
            }
        }

        @keyframes errorRoute {

            0% {
                left: -20%;
            }

            100% {
                left: 120%;
            }
        }

        @keyframes errorPulse {

            0%,
            100% {
                opacity: .45;
                transform: scale(.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        @keyframes orbFloat1 {

            0%,
            100% {
                transform: translate(0, 0);
                opacity: .35;
            }

            50% {
                transform: translate(35px, -22px);
                opacity: .9;
            }
        }

        @keyframes orbFloat2 {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-25px, 18px);
            }
        }


        /* ============================================================
           MOBILE
           ============================================================ */

        @media (max-width: 700px) {

            body {
                overflow: hidden;
            }

            .error-page::before {
                background-size: 55px 55px;
            }

            .error-page::after {
                width: 420px;
                height: 420px;
            }

            .error-header {
                width: calc(100% - 36px);
                height: 74px;
            }

            .error-logo-mark {
                width: 29px;
                height: 29px;
            }

            .error-logo-text strong {
                font-size: 11px;
            }

            .error-logo-text span {
                font-size: 6px;
            }

            .error-header-code {
                font-size: 7px;
            }

            .error-main {
                width: calc(100% - 36px);
                padding: 90px 0 70px;
            }

            .error-kicker {
                margin-bottom: 20px;
                font-size: 7px;
            }

            .error-number {
                font-size: clamp(125px, 37vw, 220px);
                letter-spacing: -.1em;
            }

            .error-number::before {
                left: -8%;
                right: -8%;
            }

            .error-title {
                margin-top: 42px;
                font-size: clamp(25px, 8vw, 36px);
            }

            .error-description {
                max-width: 300px;
                margin-top: 18px;
                font-size: 11px;
                line-height: 1.65;
            }

            .error-button {
                width: min(100%, 290px);
                min-height: 54px;
                margin-top: 27px;
            }

            .error-route {
                left: 18px;
                right: 18px;
                bottom: 21px;

                grid-template-columns: 1fr auto;

                gap: 15px;

                font-size: 7px;
            }

            .error-route-line {
                display: none;
            }

            .error-route strong {
                font-size: 7px;
            }

            .error-orb-1 {
                left: 9%;
            }

            .error-orb-2 {
                right: 10%;
            }
        }

        @media (max-width: 420px) {

            .error-header {
                width: calc(100% - 28px);
            }

            .error-main {
                width: calc(100% - 28px);
            }

            .error-number {
                font-size: 118px;
            }

            .error-title {
                font-size: 28px;
            }

            .error-description {
                font-size: 11px;
            }

            .error-button {
                width: 100%;
            }
        }


        /* ============================================================
           REDUCED MOTION
           ============================================================ */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }

        }

    </style>

</head>

<body>

    <div class="error-page">

        <!-- HEADER -->

        <header class="error-header">

            <a
                class="error-logo"
                href="/"
                aria-label="HOME LIGHT — на главную"
            >

                <span class="error-logo-mark"></span>

                <span class="error-logo-text">
                    <strong>HOME LIGHT</strong>
                    <span>LIGHTING DESIGN</span>
                </span>

            </a>

            <span class="error-header-code">
                ERROR / 404
            </span>

        </header>


        <!-- MAIN -->

        <main class="error-main">

            <div class="error-content">

                <div class="error-kicker">
                    СТРАНИЦА ОТСУТСТВУЕТ!
                </div>


                <div
                    class="error-number"
                    aria-label="Ошибка 404"
                >
                    404
                </div>


                <h1 class="error-title">
                    Свет здесь <span>не найден.</span>
                </h1>


                <p class="error-description">
                    Похоже, эта страница осталась где-то
                    за пределами светового маршрута.
                    Давайте вернёмся туда, где всё на месте.
                </p>


                <a
                    class="error-button"
                    href="/"
                >

                    <span>
                        Вернуться на сайт
                    </span>

                    <span
                        class="error-button-arrow"
                        aria-hidden="true"
                    >
                        ↗
                    </span>

                </a>

            </div>


            <!-- DECORATIVE LIGHT -->

            <span
                class="error-orb error-orb-1"
                aria-hidden="true"
            ></span>

            <span
                class="error-orb error-orb-2"
                aria-hidden="true"
            ></span>


            <!-- BOTTOM ROUTE -->

            <div class="error-route">

                <strong>
                    HOME LIGHT
                </strong>

                <span class="error-route-line">
                    <span class="error-route-light"></span>
                </span>

                <span>
                    YEKATERINBURG / RU
                </span>

            </div>

        </main>

    </div>

</body>
</html>
